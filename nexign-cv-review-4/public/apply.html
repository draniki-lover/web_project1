<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заявка на разбор CV — Nexign CV Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <img class="logo" src="img/logo.png" alt="nexign"><span class="sep"></span><span>CV Review</span>
    </a>
    <button class="burger" id="burger" type="button" aria-label="Меню"><span></span></button>
    <nav class="menu" id="menu">
      <a href="index.html#about">О нас</a>
      <a href="internships.html">Стажировки</a>
      <a href="guide.html">Как подготовить CV самостоятельно?</a>
    </nav>
  </div>
</header>

<main>

<div class="wrap apply">
  
  <!-- ФОНОВЫЕ ВОЛНЫ (вертикальные с наклоном) -->
  <div class="apply-bg-waves">
    <svg viewBox="0 0 1000 1000" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
      
      <!-- Волна 1: Идет сверху-слева, вниз и закручивается вправо (под формой) -->
      <path d="M -50 100 
               C 150 250, 100 500, 300 700 
               C 500 900, 600 700, 1050 850" 
            stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" opacity="0.3"/>

      <!-- Волна 2: Идет сверху-справа, спускается вниз и уходит влево (над формой) -->
      <path d="M 1050 50 
               C 800 150, 900 400, 700 550 
               C 500 700, 400 400, -50 300" 
            stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" opacity="0.3"/>
               
    </svg>
  </div>

  <!-- 3. ЗАГОЛОВОК И ФОРМА -->
  <h1 class="page-title">Заявка на разбор CV</h1>

  <form class="form-frame frame" id="form" novalidate>
    <img class="deco sticker star" src="img/star.png" alt="">
    <img class="deco sticker bubble" src="img/bubble.png" alt="">

    <div class="field" id="f-name">
      <label for="name">ФИО</label>
      <input class="input" id="name" type="text" autocomplete="name">
    </div>

    <div class="field" id="f-email">
      <label for="email">Рабочий email</label>
      <input class="input" id="email" type="email" autocomplete="email">
    </div>

    <div class="field" id="f-dir">
      <span class="lbl">Интересующая стажировка</span>
      <div class="dd" id="dd">
        <button class="dd-btn" id="dd-btn" type="button">
          <span id="dd-text" class="placeholder">Выберите направление</span><span class="chev"></span>
        </button>
        <div class="dd-list" id="dd-list"></div>
      </div>
    </div>

    <span class="lbl" style="margin-top:18px">Место для загрузки вашего резюме</span>
    <div class="lower">
      <div class="field" id="f-file" style="margin:0">
        <label class="upload" for="file">
          <svg class="clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M21 11.5l-8.6 8.6a5 5 0 01-7-7l9-9a3.3 3.3 0 014.7 4.7l-9 9a1.7 1.7 0 01-2.4-2.4l8.3-8.3"/></svg>
          <span class="fname" id="fname"></span>
          <span class="hint"><b>PDF</b><span>максимальный размер файла: 10 мб</span></span>
          <input type="file" id="file" accept=".pdf,application/pdf">
        </label>
      </div>
      <div class="checks">
        <label class="check">
          <input type="checkbox" id="consent">
          <span>Даю согласие на <a href="#" target="_blank">обработку персональных данных</a></span>
        </label>
        <label class="check">
          <input type="checkbox" id="subscribe">
          <span>Подписаться на рассылку Nexign</span>
        </label>
        <div class="error-box" id="errbox"></div>
      </div>
    </div>
  </form>

  <div class="submit-row"><button class="btn" id="submit" type="button">Отправить</button></div>
</div>

</main>

<footer class="footer">
  <div class="f-top">
    <div><img class="f-logo" src="img/logo.png" alt="nexign"></div>
    <div class="f-col">
      <h4>Карта сайта</h4>
      <a href="index.html#about">О нас</a>
      <a href="internships.html">Стажировки</a>
      <a href="guide.html">Как подготовить CV самостоятельно?</a>
    </div>
    <div class="f-col">
      <h4>Контакты</h4>
      <a href="mailto:job@nexign.com">job@nexign.com</a>
      <a href="tel:+78123261299">+7 (812) 326-12-99</a>
    </div>
  </div>
   <div class="f-bottom">
    <div>© АО «Нэксайн», 1992–2025</div>
    <div class="f-wave-container">
        <!-- Волна с двумя петлями -->
        <svg class="f-wave" viewBox="0 0 1000 200" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 0 20 
                     C 150 180, 350 180, 450 130 
                     C 520 90, 540 160, 480 160 
                     C 420 160, 440 80, 510 80 
                     C 600 80, 650 160, 750 160 
                     C 820 160, 850 90, 850 60 
                     C 850 20, 920 20, 920 60 
                     C 920 100, 870 130, 810 130 
                     C 750 130, 700 90, 720 50 
                     C 740 10, 800 0, 900 0 
                     C 950 0, 980 20, 1000 20" 
                  stroke="#ffffff" 
                  stroke-width="1.5" 
                  stroke-dasharray="6 6" 
                  stroke-linecap="round" 
                  opacity="0.4"/>
        </svg>
    </div>
</footer>

<div class="toast" id="toast"></div>

<script src="js/main.js"></script>
<script src="js/email-check.js"></script>
<script src="js/apply.js"></script>
</body>
</html>
